name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false
      - name: Check Zig formatting
        run: zig fmt --check build.zig src tests examples
      - name: Compile all Zig artifacts
        run: zig build check --summary all
      - name: Zig unit and snapshot tests
        run: zig build test --summary all
      - name: Check, generate, and test all examples
        shell: bash
        run: |
          set -euo pipefail
          examples=(
            examples/01-scalar
            examples/02-errors
            examples/03-opaque
            examples/04-callback
            examples/05-pipeline
            examples/06-camel-case
            examples/07-event-queue
            examples/08-telemetry-hub
            examples/09-type-relations
            examples/10-tagged-union
          )

          for example in "${examples[@]}"; do
            (
              cd "$example"
              zig build test --summary all
              zig build go-check abi-check --summary all
              zig build go
            )
          done

          if [[ -n "$(git status --porcelain --untracked-files=all -- examples)" ]]; then
            echo "Generated example files are stale. Run 'zig build go' in each changed example and commit the result."
            git status --short -- examples
            git diff -- examples
            exit 1
          fi

          for example in "${examples[@]}"; do
            (
              cd "$example/go"
              go test ./...
            )
          done
      - name: Record cgo call overhead
        working-directory: examples/01-scalar/go
        run: go test ./scalar -run '^$' -bench '^BenchmarkAddCgo$' -benchmem

  purego:
    # purego bindings load a native artifact at run time, so every supported
    # host architecture needs its own job; a Zig shared library is not portable.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      LIB_SUFFIX: ${{ startsWith(matrix.os, 'macos') && '.dylib' || '.so' }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false
      - name: Generate and validate purego bindings
        shell: bash
        # 08-telemetry-hub uses the automatic, internal-loader policy; the others
        # keep the default explicit loader, so both policies are exercised.
        run: |
          set -euo pipefail
          for example in 04-callback 08-telemetry-hub; do
            (cd "examples/$example" && zig build purego-go purego-go-verify --summary all)
          done
          (cd examples/10-tagged-union && zig build go go-verify -Dpurego --summary all)

          if grep -q "LoadLibrary" examples/08-telemetry-hub/go-purego/telemetry_hub/*_gen.go; then
            echo "The internal-loader policy leaked a loader into the public package."
            exit 1
          fi
      - name: Build both backends from one tree
        shell: bash
        # A static archive and a shared library with the same base name live in
        # one zig-out/lib; the cgo link and the C header must still resolve to
        # the cgo artifacts. This is also this example's purego coverage.
        run: |
          set -euo pipefail
          cd examples/07-event-queue
          rm -rf zig-out
          zig build go purego-go purego-go-verify --summary all
          test -f "zig-out/lib/libevent_queue_zigo.a"
          test -f "zig-out/lib/libevent_queue_zigo$LIB_SUFFIX"
          test -f zig-out/include/zigo_event_queue.h
          test -f zig-out/include/zigo_event_queue_purego.h
          (cd go && go test ./...)
          (cd go-purego && CGO_ENABLED=0 go test ./...)
      - name: Check that generated purego files are platform neutral
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all -- examples)" ]]; then
            echo "Generated purego files are stale or platform specific. Regenerate and commit them."
            git status --short -- examples
            git diff -- examples
            exit 1
          fi
      - name: Inspect the shared artifacts
        shell: bash
        run: |
          set -euo pipefail
          libraries=(
            "04-callback:libcallback_zigo:zg_last_error_message zg_apply_purego_v1"
            "07-event-queue:libevent_queue_zigo:zg_last_error_message"
            "08-telemetry-hub:libtelemetry_hub_zigo:zg_last_error_message"
            "10-tagged-union:libtagged_union_zigo:zg_last_error_message"
          )
          for entry in "${libraries[@]}"; do
            read -r example stem symbols <<<"${entry//:/ }"
            library="examples/$example/zig-out/lib/$stem$LIB_SUFFIX"
            # The script checks the file and its dependencies; the smoke loader
            # resolves the symbols through the real platform loader.
            tests/inspect_shared_library.sh "$library"
            zig build shared-library-smoke -- "$library" $symbols
          done
      - name: Run the purego examples without cgo
        shell: bash
        # The race detector still requires cgo, so these jobs assert the
        # cgo-free contract instead; the cgo matrix keeps the raced coverage.
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for example in 04-callback 08-telemetry-hub; do
            (cd "examples/$example/go-purego" && go test ./...)
          done

          cd examples/10-tagged-union/go-purego
          ZIGO_TEST_LIBRARY="$PWD/../zig-out/lib/libtagged_union_zigo$LIB_SUFFIX" \
          ZIGO_TEST_WRONG_LIBRARY="$PWD/../../04-callback/zig-out/lib/libcallback_zigo$LIB_SUFFIX" \
            go test ./...

  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Compile all Zig artifacts
        run: zig build check --summary all

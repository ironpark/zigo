name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Check Zig formatting
        run: zig fmt --check build.zig src tests examples
      - name: Compile all Zig artifacts
        run: zig build check --summary all
      - name: Zig unit and snapshot tests
        run: zig build test --summary all
      # Catches a Windows-only compile break here rather than on the Windows
      # runner, where it costs a whole job. Both arches, since purego supports
      # windows/arm64 too.
      - name: Compile all Zig artifacts for Windows
        run: |
          zig build check -Dtarget=x86_64-windows-gnu --summary all
          zig build check -Dtarget=aarch64-windows-gnu --summary all
      - name: Check, generate, and test all examples
        shell: bash
        run: |
          set -euo pipefail
          examples=(
            examples/01-scalar
            examples/02-errors
            examples/03-opaque
            examples/04-callback
            examples/05-pipeline
            examples/06-camel-case
            examples/07-event-queue
            examples/08-telemetry-hub
            examples/09-type-relations
            examples/10-tagged-union
          )

          for example in "${examples[@]}"; do
            (
              cd "$example"
              zig build test --summary all
              zig build go-check abi-check --summary all
              zig build go
            )
          done

          if [[ -n "$(git status --porcelain --untracked-files=all -- examples)" ]]; then
            echo "Generated example files are stale. Run 'zig build go' in each changed example and commit the result."
            git status --short -- examples
            git diff -- examples
            exit 1
          fi

          for example in "${examples[@]}"; do
            (
              cd "$example/go"
              go test ./...
            )
          done
      - name: Record cgo call overhead
        working-directory: examples/01-scalar/go
        run: go test ./scalar -run '^$' -bench '^BenchmarkAddCgo$' -benchmem
      # Reflection builds for the host (plan 57), so a POSIX runner can also
      # produce the Windows static archive; `zig cc` supplies the mingw
      # headers, CRT, and linker that cgo would otherwise need from mingw-w64.
      # This leg only proves the executables link -- `cgo-windows-cross` runs
      # them, which is the half a POSIX host cannot check.
      - name: Cross-build the Windows cgo test executables
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: zig cc -target x86_64-windows-gnu
        run: |
          set -euo pipefail
          mkdir -p cross-cgo/01-scalar cross-cgo/07-event-queue
          (cd examples/01-scalar && zig build go-lib -Dtarget=x86_64-windows-gnu)
          (cd examples/01-scalar/go && go test -c -o "$GITHUB_WORKSPACE/cross-cgo/01-scalar" ./...)
          (cd examples/07-event-queue && zig build go-lib -Dtarget=x86_64-windows-gnu)
          (cd examples/07-event-queue/go && go test -c -o "$GITHUB_WORKSPACE/cross-cgo/07-event-queue" ./...)
          # The archive is linked into each executable, so the artifact needs
          # nothing else -- but a missing file here would silently ship an
          # empty artifact, so name what must exist.
          test -f cross-cgo/01-scalar/scalar.test.exe
          test -f cross-cgo/07-event-queue/event_queue.test.exe
          test -f cross-cgo/07-event-queue/cgo.test.exe
      - uses: actions/upload-artifact@v4
        with:
          name: cgo-windows-tests
          path: cross-cgo
          if-no-files-found: error

  purego:
    runs-on: ubuntu-latest
    env:
      LIB_SUFFIX: .so
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Generate and validate purego bindings
        shell: bash
        # 08-telemetry-hub uses the automatic, internal-loader policy; the others
        # keep the default explicit loader, so both policies are exercised.
        run: |
          set -euo pipefail
          for example in 04-callback 08-telemetry-hub; do
            (cd "examples/$example" && zig build purego-go purego-go-verify --summary all)
          done
          (cd examples/10-tagged-union && zig build go go-verify -Dpurego --summary all)

          if grep -q "LoadLibrary" examples/08-telemetry-hub/go-purego/telemetry_hub/*_gen.go; then
            echo "The internal-loader policy leaked a loader into the public package."
            exit 1
          fi
      - name: Build both backends from one tree
        shell: bash
        # A static archive and a shared library with the same base name live in
        # one zig-out/lib; the cgo link and the C header must still resolve to
        # the cgo artifacts. This is also this example's purego coverage.
        run: |
          set -euo pipefail
          cd examples/07-event-queue
          rm -rf zig-out
          zig build go purego-go purego-go-verify --summary all
          test -f "zig-out/lib/libevent_queue_zigo.a"
          test -f "zig-out/lib/libevent_queue_zigo$LIB_SUFFIX"
          test -f zig-out/include/zigo_event_queue.h
          test -f zig-out/include/zigo_event_queue_purego.h
          (cd go && go vet ./... && go test ./...)
          (cd go-purego && CGO_ENABLED=0 go vet ./... && CGO_ENABLED=0 go test ./...)
      - name: Check that generated purego files are current
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all -- examples)" ]]; then
            echo "Generated purego files are stale. Regenerate and commit them."
            git status --short -- examples
            git diff -- examples
            exit 1
          fi
      - name: Inspect the shared artifacts
        shell: bash
        run: |
          set -euo pipefail
          libraries=(
            "04-callback:libcallback_zigo:zg_last_error_message zg_apply_purego_v2"
            "07-event-queue:libevent_queue_zigo:zg_last_error_message"
            "08-telemetry-hub:libtelemetry_hub_zigo:zg_last_error_message"
            "10-tagged-union:libtagged_union_zigo:zg_last_error_message"
          )
          for entry in "${libraries[@]}"; do
            read -r example stem symbols <<<"${entry//:/ }"
            library="examples/$example/zig-out/lib/$stem$LIB_SUFFIX"
            # The script checks the file and its dependencies; the smoke loader
            # resolves the symbols through the real platform loader.
            tests/inspect_shared_library.sh "$library"
            zig build shared-library-smoke -- "$library" $symbols
          done
      # Reflection builds for the host, so a POSIX runner can produce the
      # Windows DLL. The Windows job runs 07's suite against this artifact,
      # which is what proves the cross-built library actually loads and
      # dispatches callbacks rather than merely linking.
      - name: Cross-build the Windows DLL for 07-event-queue
        working-directory: examples/07-event-queue
        run: zig build purego-go-lib -Dtarget=x86_64-windows-gnu --summary all
      - uses: actions/upload-artifact@v4
        with:
          name: event-queue-windows-dll
          path: examples/07-event-queue/zig-out/bin/event_queue_zigo.dll
          if-no-files-found: error
      - name: Run the purego examples without cgo
        shell: bash
        # The race detector still requires cgo, so this job asserts the
        # cgo-free contract; the main test job keeps cgo coverage.
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for example in 04-callback 08-telemetry-hub; do
            # vet must stay clean: generated code should not need suppressions.
            (cd "examples/$example/go-purego" && go vet ./... && go test ./...)
          done

          cd examples/10-tagged-union/go-purego
          go vet ./...
          ZIGO_TEST_LIBRARY="$PWD/../zig-out/lib/libtagged_union_zigo$LIB_SUFFIX" \
          ZIGO_TEST_WRONG_LIBRARY="$PWD/../../04-callback/zig-out/lib/libcallback_zigo$LIB_SUFFIX" \
            go test ./...

  # Plan 45 reduced CI to ubuntu-latest alone. This job partially reverses that:
  # Windows is a supported purego target, and nothing else proves the
  # build-tagged syscall loader actually loads a DLL. It is deliberately narrow
  # -- purego only, no cgo (mingw linking is unsupported) and no artifact
  # inspection, since inspect_shared_library.sh is POSIX-only. One example is
  # left to the Ubuntu job: 04-callback links system zlib, which windows-latest
  # does not provide. 08-telemetry-hub rejoined this job once float callback
  # parameters started crossing as integer bit patterns, and it is the only
  # coverage anywhere of floats in a Windows callback and in a Windows purego
  # call.
  purego-windows:
    runs-on: windows-latest
    steps:
      # The generated files are committed with LF, and go-check compares the
      # regenerated bytes against them; the runner's default autocrlf would
      # report every one of them as stale.
      - name: Keep the checkout free of CRLF rewrites
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      # `check` compiles every artifact without running any of them. That is
      # exactly the regression that broke this job's first run -- doctor.zig
      # referencing std.DynLib, which has no Windows implementation -- and it
      # skips what `test` would drag in here: the cgo generation fixture and
      # the Go-based godoc audit, neither of which this plan supports on
      # Windows. Test *behaviour* is platform-independent and stays on Ubuntu;
      # what is Windows-specific is that the tooling compiles, and that the
      # loader really loads a DLL, which the Go suites below prove.
      - name: Compile all Zig artifacts
        run: zig build check --summary all
      - name: Generate, build, and validate the purego bindings
        shell: bash
        # go-verify covers staleness, the toolchain doctor, and the native
        # library, so this also asserts that the doctor passes on Windows.
        run: |
          set -euo pipefail
          for example in 07-event-queue 08-telemetry-hub; do
            (cd "examples/$example" && zig build purego-go purego-go-verify --summary all)
          done
          (cd examples/10-tagged-union && zig build go go-verify -Dpurego --summary all)

          # Zig installs a DLL into `bin`, not `lib`, and it carries no `lib`
          # prefix -- which is what DefaultLibraryName expects on windows.
          test -f examples/07-event-queue/zig-out/bin/event_queue_zigo.dll
          test -f examples/08-telemetry-hub/zig-out/bin/telemetry_hub_zigo.dll
          test -f examples/10-tagged-union/zig-out/bin/tagged_union_zigo.dll
      - name: Run the purego examples without cgo
        shell: bash
        # The race detector needs cgo, exactly as on the POSIX purego job.
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          # 08-telemetry-hub is what proves floats survive a Windows callback
          # and a Windows purego call; 07 covers the explicit loader policy.
          for example in 07-event-queue 08-telemetry-hub; do
            (cd "examples/$example/go-purego" && go vet ./... && go test ./...)
          done

          cd examples/10-tagged-union/go-purego
          go vet ./...
          ZIGO_TEST_LIBRARY="$PWD/../zig-out/bin/tagged_union_zigo.dll" \
          ZIGO_TEST_WRONG_LIBRARY="$PWD/../../07-event-queue/zig-out/bin/event_queue_zigo.dll" \
            go test ./...

  # Proves the cross-compiled artifact at runtime, which is the half a POSIX
  # host cannot check. Deliberately separate from purego-windows so the
  # existing native legs do not wait on the Ubuntu job: this one needs no Zig
  # and no generation, only Go and the committed bindings.
  purego-windows-cross:
    runs-on: windows-latest
    needs: purego
    steps:
      - name: Keep the checkout free of CRLF rewrites
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: event-queue-windows-dll
          path: cross-dll
      # 07's suite loads ZIGO_LIBRARY_PATH in preference to the zig-out
      # artifact, so pointing it at the download runs the whole suite --
      # callbacks included -- against the Ubuntu-cross-built DLL.
      - name: Run 07-event-queue against the cross-built DLL
        working-directory: examples/07-event-queue/go-purego
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          export ZIGO_LIBRARY_PATH="$GITHUB_WORKSPACE/cross-dll/event_queue_zigo.dll"
          test -f "$ZIGO_LIBRARY_PATH"
          go test ./...

  # Windows cgo without mingw-w64: `zig cc` is a gcc-compatible clang driver
  # that ships its own mingw headers, CRT, and linker, and every zigo user
  # already has Zig. Plan 59's spike found exactly one obstacle -- Zig names a
  # windows static archive `<name>.lib` while the generated `#cgo LDFLAGS`
  # line spells it `lib<name>.a` -- which build.zig now fixes at install time.
  # 04-callback is left out: it links system zlib, which windows-latest does
  # not provide, the same reason the purego job skips it.
  cgo-windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
      CC: zig cc
    steps:
      # The generated files are committed with LF, and go-check compares the
      # regenerated bytes against them; the runner's default autocrlf would
      # report every one of them as stale.
      - name: Keep the checkout free of CRLF rewrites
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Generate, build, and validate the cgo bindings
        shell: bash
        # go-verify covers staleness, the toolchain doctor, and the native
        # library, so this also asserts the cgo doctor passes on Windows with
        # `zig cc` as CC.
        run: |
          set -euo pipefail
          for example in 01-scalar 07-event-queue; do
            (cd "examples/$example" && zig build go go-verify --summary all)
          done

          # The archive name is the whole of plan 59's build fix; assert it so
          # a regression fails here rather than in an opaque link error.
          test -f examples/01-scalar/zig-out/lib/libscalar_zigo.a
          test -f examples/07-event-queue/zig-out/lib/libevent_queue_zigo.a
      - name: Run the cgo examples
        shell: bash
        # No CGO_CFLAGS or CGO_LDFLAGS: cgo's compile and link stages both go
        # through `zig cc` unmodified, including the -Wl,--tsaware/--nxcompat
        # hardening flags and the -lmingwex -lmingw32 -lkernel32 closing group
        # that the Go external linker appends.
        run: |
          set -euo pipefail
          for example in 01-scalar 07-event-queue; do
            (cd "examples/$example/go" && go vet ./... && go test ./...)
          done

  # Proves the POSIX-cross-built cgo executables at runtime. Deliberately
  # separate from cgo-windows so the native legs do not wait on the Ubuntu
  # job: this one needs neither Zig nor Go generation, only the artifact.
  cgo-windows-cross:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cgo-windows-tests
          path: cross-cgo
      # The static archive is already linked in, so these run standalone --
      # no zig-out, no checkout, no DLL beside them.
      - name: Run the cross-built cgo test executables
        shell: bash
        run: |
          set -euo pipefail
          ./cross-cgo/01-scalar/scalar.test.exe -test.v
          ./cross-cgo/07-event-queue/event_queue.test.exe -test.v
          ./cross-cgo/07-event-queue/cgo.test.exe -test.v
